<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deutsche Gegenteile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --text-xs: clamp(0.68rem, 0.64rem + 0.2vw, 0.78rem);
      --text-sm: clamp(0.80rem, 0.76rem + 0.22vw, 0.90rem);
      --text-base: clamp(0.90rem, 0.86rem + 0.22vw, 1.00rem);
      --text-lg: clamp(1.05rem, 0.95rem + 0.55vw, 1.32rem);
      --text-xl: clamp(1.3rem, 1.0rem + 1.0vw, 1.9rem);

      --radius-sm: 0.6rem;
      --radius-md: 1.0rem;
      --radius-lg: 1.4rem;
      --radius-xl: 1.8rem;
      --radius-full: 9999px;

      --bg: #e8e8ec;
      --surface: #e8e8ec;
      --surface-up: #f0f0f4;

      --text-color: #2a2a35;
      --text-soft: #7a7a8a;
      --text-faint: #b0b0bc;

      --sh-dark: rgba(180, 180, 195, 0.85);
      --sh-light: rgba(255, 255, 255, 0.92);
      --neo-raise: 6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light);
      --neo-raise-lg: 10px 10px 26px var(--sh-dark), -10px -10px 26px var(--sh-light);
      --neo-inset: inset 4px 4px 10px var(--sh-dark), inset -4px -4px 10px var(--sh-light);

      --acc: #4a9ed6;
      --success: #5aaa78;
      --danger: #d07070;

      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #1e1e24;
      --surface: #1e1e24;
      --surface-up: #26262e;

      --text-color: #e8e4de;
      --text-soft: #9090a0;
      --text-faint: #55555f;

      --sh-dark: rgba(0, 0, 0, 0.60);
      --sh-light: rgba(255, 255, 255, 0.048);
      --neo-raise: 6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light);
      --neo-raise-lg: 10px 10px 26px var(--sh-dark), -10px -10px 26px var(--sh-light);
      --neo-inset: inset 4px 4px 10px rgba(0, 0, 0, 0.55), inset -4px -4px 10px rgba(255, 255, 255, 0.035);

      --acc: #58a8cc;
      --success: #6aaa7e;
      --danger: #c97a73;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--text-color);
      background: var(--bg);
      transition: background 0.3s ease, color 0.3s ease;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .shell {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.6rem 0 3rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: var(--text-lg);
      color: var(--text-color);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.72rem 1.3rem;
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 700;
      background: var(--surface);
      color: var(--text-soft);
      box-shadow: var(--neo-raise);
      transition: transform 150ms ease, box-shadow 150ms ease, color 150ms ease;
      min-height: 44px;
    }

    .pill-btn.accent {
      color: var(--acc);
    }

    .pill-btn.default-state {
      background: var(--surface-up);
      color: var(--text-color);
    }

    .pill-btn:hover {
      transform: translateY(-2px);
    }

    .pill-btn:active {
      transform: scale(0.97);
      box-shadow: var(--neo-inset) !important;
    }

    .icon-pill {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--surface);
      color: var(--text-soft);
      box-shadow: var(--neo-raise);
      display: grid;
      place-items: center;
      font-size: 1rem;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .icon-pill:hover {
      transform: translateY(-2px);
    }

    .icon-pill:active {
      box-shadow: var(--neo-inset) !important;
      transform: scale(0.97);
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .lang-btn {
      min-width: 58px;
      justify-content: center;
    }

    .lang-btn.active {
      background: var(--surface-up);
      color: var(--acc);
      box-shadow: var(--neo-inset);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.2rem;
      align-items: start;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--neo-raise-lg);
      padding: 1.4rem;
    }

    .panel-title {
      font-size: var(--text-xs);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-faint);
      margin: 0 0 1rem;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--neo-inset);
      margin-bottom: 0.65rem;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label-sm {
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-faint);
    }

    .stat-val {
      font-size: var(--text-sm);
      font-weight: 800;
      color: var(--text-color);
      font-variant-numeric: tabular-nums;
    }

    .prog-track {
      height: 8px;
      border-radius: 99px;
      background: var(--surface);
      box-shadow: var(--neo-inset);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--acc);
      box-shadow: 0 0 10px rgba(74, 158, 214, 0.35);
      transition: width 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .prog-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.35rem;
    }

    .prog-pct {
      font-size: var(--text-xs);
      font-weight: 800;
      color: var(--acc);
    }

    .prog-count {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }

    .toast-panel {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--neo-raise-lg);
      padding: 1.1rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 56px;
    }

    .toast-text {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text-soft);
      flex: 1;
    }

    .toast-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: var(--surface);
      box-shadow: var(--neo-raise);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      flex: 0 0 auto;
      transition: color 0.3s ease;
    }

    .toast-icon.success {
      color: var(--success);
    }

    .toast-icon.danger {
      color: var(--danger);
    }

    .toast-icon.accent {
      color: var(--acc);
    }

    .toast-icon.neutral {
      color: var(--text-faint);
    }

    .log-body {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--neo-inset);
      overflow-y: auto;
      max-height: 220px;
      padding: 0.85rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.80rem;
      line-height: 1.6;
      color: var(--text-soft);
    }

    .log-line {
      margin: 0 0 0.3rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line::before {
      content: '→ ';
      color: var(--acc);
      font-weight: 700;
    }

    .log-empty {
      color: var(--text-faint);
      font-style: italic;
    }

    .board-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .board-panel {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--neo-raise-lg);
      padding: 1.4rem;
    }

    .board {
      display: grid;
      gap: 0.75rem;
    }

    .card,
    .filler {
      position: relative;
      min-height: 80px;
      border-radius: var(--radius-lg);
      padding: 0.75rem 0.55rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      line-height: 1.25;
      gap: 0.2rem;
      border: none;
    }

    .card {
      background: var(--surface);
      color: var(--text-color);
      box-shadow: var(--neo-raise);
      transition: transform 150ms ease, box-shadow 150ms ease, color 160ms ease;
    }

    .card:hover:not(:disabled):not(.selected):not(.matched):not(.wrong) {
      transform: translateY(-3px);
      box-shadow: 8px 8px 20px var(--sh-dark), -8px -8px 20px var(--sh-light);
    }

    .card:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 3px;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-faint);
      opacity: 0.5;
      transition: background 160ms ease, opacity 160ms ease;
    }

    .card.selected {
      background: var(--surface-up);
      color: var(--acc);
      box-shadow: var(--neo-inset);
      transform: scale(0.97);
    }

    .card.selected::after {
      background: var(--acc);
      opacity: 1;
    }

    .card.matched {
      background: var(--surface);
      color: var(--success);
      box-shadow: var(--neo-inset);
      cursor: default;
    }

    .card.matched::after {
      background: var(--success);
      opacity: 1;
    }

    .card.matched .checkmark {
      position: absolute;
      inset: auto 8px 8px auto;
      font-size: 0.75rem;
      opacity: 0.75;
    }

    .card.wrong {
      background: var(--surface);
      color: var(--danger);
      box-shadow: var(--neo-inset);
    }

    .card.wrong::after {
      background: var(--danger);
      opacity: 1;
    }

    .filler {
      background: var(--surface);
      box-shadow: var(--neo-inset);
      color: var(--text-faint);
      user-select: none;
      border-radius: var(--radius-lg);
    }

    .word-main {
      display: block;
      font-size: var(--text-sm);
    }

    .word-translation {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
    }

    .card.matched .word-translation {
      color: currentColor;
      opacity: 0.75;
    }

    .level-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .level-pill {
      padding: 0.38rem 0.85rem;
      border-radius: var(--radius-full);
      border: none;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 700;
      background: var(--surface);
      color: var(--text-faint);
      box-shadow: var(--neo-raise);
      cursor: default;
      transition: box-shadow 0.2s, color 0.2s;
    }

    .level-pill.active {
      background: var(--surface-up);
      color: var(--acc);
      box-shadow: var(--neo-inset);
    }

    .level-pill.done {
      color: var(--success);
      box-shadow: var(--neo-inset);
    }

    .segment-wrap {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
    }

    .segment-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem;
      background: var(--surface);
      border-radius: var(--radius-full);
      box-shadow: var(--neo-inset);
      width: 100%;
    }

    .segment-btn {
      flex: 1 1 0;
      min-width: 0;
      height: 40px;
      padding: 0 1rem;
      border: none;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-faint);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: 0.04em;
      transition: all 160ms ease;
    }

    .segment-btn.active {
      background: var(--surface);
      color: var(--text-color);
      box-shadow: var(--neo-raise);
    }

    .segment-btn:hover:not(.active) {
      color: var(--text-soft);
    }

    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .sidebar .panel {
        flex: 1 1 200px;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 0.75rem, 1100px);
        padding-top: 0.8rem;
      }

      .card,
      .filler {
        min-height: 68px;
        font-size: 0.82rem;
      }

      .word-translation {
        font-size: 0.62rem;
      }

      .board {
        gap: 0.5rem;
      }

      .sidebar {
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .segment-switch {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span>Deutsche Gegenteile</span>
      </div>

      <div class="top-actions">
        <button class="icon-pill" data-theme-toggle aria-label="Thema wechseln">
          <span aria-hidden="true">◐</span>
        </button>

        <div class="lang-switch" id="langSwitch" aria-label="Sprache wählen">
          <button class="pill-btn lang-btn" data-lang="en" type="button">EN</button>
          <button class="pill-btn lang-btn" data-lang="uk" type="button">UK</button>
          <button class="pill-btn lang-btn" data-lang="hu" type="button">HU</button>
        </div>

        <button class="pill-btn" id="resetProgressBtn">Zurücksetzen</button>
        <button class="pill-btn accent" id="shuffleBtn">Neues Feld</button>
      </div>
    </header>

    <div class="main-grid" id="game">
      <aside class="sidebar" aria-label="Spielstatistik">
        <div class="panel">
          <p class="panel-title">Wortniveau</p>

          <div class="segment-wrap">
            <div class="segment-switch" id="categorySwitch" role="tablist" aria-label="Niveau wählen">
              <button class="segment-btn active" data-category="A1" type="button">A1</button>
              <button class="segment-btn" data-category="A2" type="button">A2</button>
              <button class="segment-btn" data-category="B1" type="button">B1</button>
            </div>
          </div>

          <p class="panel-title">Statistik</p>

          <div class="level-pills" id="levelPills"></div>

          <div class="stat-row">
            <span class="stat-label-sm">Aktuelles Niveau</span>
            <span class="stat-val" id="categoryValue">A1</span>
          </div>

          <div class="stat-row">
            <span class="stat-label-sm">Aktuelles Level</span>
            <span class="stat-val" id="levelValue">3 × 2</span>
          </div>

          <div class="stat-row">
            <span class="stat-label-sm">Wörter gesamt</span>
            <span class="stat-val" id="totalWordsValue">—</span>
          </div>

          <div class="stat-row" style="flex-direction:column; align-items:stretch; gap:0;">
            <div style="display:flex;justify-content:space-between;margin-bottom:0.45rem;">
              <span class="stat-label-sm">Fortschritt</span>
              <span class="prog-pct" id="levelProgressPct">0%</span>
            </div>
            <div class="prog-track">
              <div class="prog-fill" id="levelProgressFill"></div>
            </div>
            <div class="prog-labels">
              <span></span>
              <span class="prog-count" id="levelProgressLabel">0 / 0</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <p class="panel-title">Richtige Paare</p>
          <div class="log-body" id="terminalBody" aria-live="polite">
            <span class="log-empty">Noch keine richtigen Paare.</span>
          </div>
        </div>
      </aside>

      <div class="board-col">
        <div class="board-panel">
          <div class="board" id="board" role="grid" aria-label="Spielfeld"></div>
        </div>

        <div class="toast-panel" aria-live="polite" aria-atomic="true">
          <span class="toast-text" id="statusText">Wähle eine Karte, dann klicke ihr Antonym.</span>
          <div class="toast-icon neutral" id="toastIcon" aria-hidden="true">○</div>
        </div>
      </div>
    </div>
  </div>

  <script src="dictionary.js"></script>
  <script>
    const LEVELS = [
      { id: '3×2', cols: 3, rows: 2 },
      { id: '3×3', cols: 3, rows: 3 },
      { id: '4×3', cols: 4, rows: 3 },
      { id: '4×4', cols: 4, rows: 4 },
      { id: '6×3', cols: 6, rows: 3 },
      { id: '6×6', cols: 6, rows: 6 }
    ];

    const STORAGE_KEY = 'german-antonyms-progress-v6';
    const LANG_STORAGE_KEY = 'german-antonyms-language-v1';
    const CATEGORY_STORAGE_KEY = 'german-antonyms-category-v1';

    const board = document.getElementById('board');
    const statusText = document.getElementById('statusText');
    const toastIcon = document.getElementById('toastIcon');
    const levelValue = document.getElementById('levelValue');
    const categoryValue = document.getElementById('categoryValue');
    const totalWordsValue = document.getElementById('totalWordsValue');
    const levelProgressFill = document.getElementById('levelProgressFill');
    const levelProgressLabel = document.getElementById('levelProgressLabel');
    const levelProgressPct = document.getElementById('levelProgressPct');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const resetProgressBtn = document.getElementById('resetProgressBtn');
    const themeToggle = document.querySelector('[data-theme-toggle]');
    const terminalBody = document.getElementById('terminalBody');
    const levelPillsEl = document.getElementById('levelPills');
    const langSwitch = document.getElementById('langSwitch');
    const categorySwitch = document.getElementById('categorySwitch');

    if (!Array.isArray(window.allPairs)) {
      throw new Error('dictionary.js not loaded or window.allPairs is missing');
    }

    const allPairs = window.allPairs;

    let currentLevelIndex = 0;
    let firstSelection = null;
    let matchedCount = 0;
    let cards = [];
    let lockBoard = false;
    let autoAdvanceTimer = null;
    let currentTheme = 'light';
    let currentLang = 'uk';
    let currentCategory = 'A1';
    let matchLog = [];

    const shuffle = arr => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    const sample = (arr, n) => shuffle(arr).slice(0, n);

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentLevelIndex }));
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = Number(JSON.parse(raw).currentLevelIndex);
        if (Number.isInteger(s) && s >= 0 && s < LEVELS.length) {
          currentLevelIndex = s;
        }
      } catch {
        currentLevelIndex = 0;
      }
    }

    function clearProgress() {
      localStorage.removeItem(STORAGE_KEY);
      currentLevelIndex = 0;
      startBoard('Fortschritt zurückgesetzt. Starte bei 3×2.');
      saveProgress();
    }

    function saveLanguage() {
      localStorage.setItem(LANG_STORAGE_KEY, currentLang);
    }

    function loadLanguage() {
      const saved = localStorage.getItem(LANG_STORAGE_KEY);
      if (['en', 'uk', 'hu'].includes(saved)) {
        currentLang = saved;
      }
    }

    function saveCategory() {
      localStorage.setItem(CATEGORY_STORAGE_KEY, currentCategory);
    }

    function loadCategory() {
      const saved = localStorage.getItem(CATEGORY_STORAGE_KEY);
      if (['A1', 'A2', 'B1'].includes(saved)) {
        currentCategory = saved;
      }
    }

    const currentLevel = () => LEVELS[currentLevelIndex];
    const getLevelLabel = () => currentLevel().id;
    const getTotalSlots = () => currentLevel().cols * currentLevel().rows;
    const getPairCount = () => Math.floor(getTotalSlots() / 2);
    const hasFiller = () => getTotalSlots() % 2 !== 0;

    function getFilteredPairs() {
      return allPairs.filter(item => item.level === currentCategory);
    }

    function getAntonymMap() {
      const map = new Map();
      getFilteredPairs().forEach(p => {
        map.set(p.de1, p.de2);
        map.set(p.de2, p.de1);
      });
      return map;
    }

    function getWordTranslation(word) {
      const p = allPairs.find(x => x.de1 === word || x.de2 === word);
      if (!p) return '';
      const side = p.de1 === word ? '1' : '2';
      const key = `${currentLang}${side}`;
      return p[key] || '';
    }

    function renderLanguageSwitcher() {
      if (!langSwitch) return;
      langSwitch.querySelectorAll('.lang-btn').forEach(btn => {
        const isActive = btn.dataset.lang === currentLang;
        btn.classList.toggle('active', isActive);
        btn.classList.toggle('default-state', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
    }

    function renderCategorySwitcher() {
      if (!categorySwitch) return;
      categorySwitch.querySelectorAll('.segment-btn').forEach(btn => {
        const isActive = btn.dataset.category === currentCategory;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      categoryValue.textContent = currentCategory;
    }

    function setLanguage(lang) {
      if (!['en', 'uk', 'hu'].includes(lang)) return;
      currentLang = lang;
      saveLanguage();
      renderLanguageSwitcher();
      renderBoard();
      renderMatchLog();
      setToast(`Sprache der Übersetzung: ${lang.toUpperCase()}`, 'accent');
    }

    function setCategory(category) {
      if (!['A1', 'A2', 'B1'].includes(category)) return;
      currentCategory = category;
      currentLevelIndex = 0;
      matchedCount = 0;
      firstSelection = null;
      matchLog = [];
      saveCategory();
      renderCategorySwitcher();
      renderMatchLog();
      startBoard(`Niveau ${category} ausgewählt.`, 'accent');
    }

    function renderLevelPills() {
      levelPillsEl.innerHTML = LEVELS.map((l, i) => {
        let cls = 'level-pill';
        if (i < currentLevelIndex) cls += ' done';
        if (i === currentLevelIndex) cls += ' active';
        return `<span class="${cls}">${l.id}</span>`;
      }).join('');
    }

    function setToast(msg, type = 'neutral') {
      statusText.textContent = msg;
      toastIcon.className = `toast-icon ${type}`;
      const icons = { neutral: '○', success: '✓', danger: '✕', accent: '◈' };
      toastIcon.textContent = icons[type] || '○';
    }

    function updateStats() {
      const filteredPairs = getFilteredPairs();
      levelValue.textContent = `${currentLevel().cols} × ${currentLevel().rows}`;
      categoryValue.textContent = currentCategory;
      totalWordsValue.textContent = String(filteredPairs.length * 2);

      const pairCount = Math.min(getPairCount(), filteredPairs.length);
      const pct = pairCount > 0 ? Math.round((matchedCount / pairCount) * 100) : 0;

      levelProgressFill.style.width = `${pct}%`;
      levelProgressLabel.textContent = `${matchedCount} / ${pairCount}`;
      levelProgressPct.textContent = `${pct}%`;
      renderLevelPills();
    }

    function addToMatchLog(wordA, wordB) {
      const entries = [
        { word: wordA, translation: getWordTranslation(wordA) },
        { word: wordB, translation: getWordTranslation(wordB) }
      ].sort((a, b) => a.word.localeCompare(b.word, 'de'));

      matchLog.push({
        category: currentCategory,
        level: getLevelLabel(),
        a: entries[0].word,
        b: entries[1].word
      });

      renderMatchLog();
    }

    function renderMatchLog() {
      terminalBody.innerHTML = matchLog.length
        ? matchLog.map(item => `
            <div class="log-line">[${item.category} · ${item.level}] ${item.a} (${getWordTranslation(item.a)}) ↔ ${item.b} (${getWordTranslation(item.b)})</div>
          `).join('')
        : `<span class="log-empty">Noch keine richtigen Paare.</span>`;

      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    function createDeck() {
      const sourcePairs = getFilteredPairs();
      const pairCount = Math.min(getPairCount(), sourcePairs.length);

      const deck = sample(sourcePairs, pairCount).flatMap(p => [
        { id: `${p.de1}-${crypto.randomUUID()}`, word: p.de1, matched: false, filler: false },
        { id: `${p.de2}-${crypto.randomUUID()}`, word: p.de2, matched: false, filler: false }
      ]);

      if ((pairCount * 2) < getTotalSlots()) {
        const fillerCount = getTotalSlots() - (pairCount * 2);
        for (let i = 0; i < fillerCount; i++) {
          deck.push({ id: `filler-${crypto.randomUUID()}`, word: '', matched: true, filler: true });
        }
      } else if (hasFiller()) {
        deck.push({ id: `filler-${crypto.randomUUID()}`, word: '', matched: true, filler: true });
      }

      return shuffle(deck).slice(0, getTotalSlots());
    }

    function renderBoard() {
      board.style.gridTemplateColumns = `repeat(${currentLevel().cols}, minmax(0,1fr))`;
      board.innerHTML = '';

      cards.forEach((c, i) => {
        if (c.filler) {
          const f = document.createElement('div');
          f.className = 'filler';
          f.setAttribute('role', 'gridcell');
          f.setAttribute('aria-label', `Leere Zelle ${i + 1}`);
          board.appendChild(f);
          return;
        }

        const btn = document.createElement('button');
        btn.className = 'card' + (c.matched ? ' matched' : '');
        btn.type = 'button';
        btn.dataset.id = c.id;
        btn.setAttribute('role', 'gridcell');
        btn.setAttribute('aria-label', `Karte ${i + 1}: ${c.word}`);

        const tr = c.matched ? getWordTranslation(c.word) : '';

        btn.innerHTML = `
          <span class="word-main">${c.word}</span>
          ${tr ? `<span class="word-translation">${tr}</span>` : ''}
          ${c.matched ? '<span class="checkmark" aria-hidden="true">✓</span>' : ''}
        `;

        btn.addEventListener('click', () => handleCardClick(c, btn));
        board.appendChild(btn);
      });
    }

    function clearTempStates() {
      board.querySelectorAll('.card.selected,.card.wrong').forEach(el => {
        el.classList.remove('selected', 'wrong');
      });
    }

    function startBoard(msg, msgType = 'neutral') {
      clearTimeout(autoAdvanceTimer);
      matchedCount = 0;
      firstSelection = null;
      lockBoard = false;
      cards = createDeck();
      renderBoard();
      updateStats();
      setToast(msg || 'Wähle eine Karte, dann klicke ihr Antonym.', msgType);
      saveProgress();
    }

    function moveToNextLevel() {
      if (currentLevelIndex < LEVELS.length - 1) {
        currentLevelIndex++;
        startBoard('Wähle eine Karte, dann klicke ihr Antonym.', 'neutral');
      } else {
        startBoard('Du bist auf dem letzten Level. Weiter so!', 'success');
      }
    }

    function markMatched(wordA, wordB) {
      cards = cards.map(c => (
        c.word === wordA || c.word === wordB
          ? { ...c, matched: true }
          : c
      ));

      matchedCount++;
      addToMatchLog(wordA, wordB);
      firstSelection = null;
      renderBoard();
      updateStats();

      const pairCount = Math.min(getPairCount(), getFilteredPairs().length);

      if (matchedCount === pairCount) {
        setToast('Level abgeschlossen! Nächstes wird geladen…', 'success');
        autoAdvanceTimer = setTimeout(moveToNextLevel, 1100);
      } else {
        setToast('Richtig! Übersetzung erscheint unter den Wörtern.', 'success');
      }
    }

    function handleCardClick(cardData, buttonEl) {
      if (lockBoard || cardData.matched || cardData.filler) return;

      if (!firstSelection) {
        clearTempStates();
        firstSelection = { ...cardData, element: buttonEl };
        buttonEl.classList.add('selected');
        setToast(`Erste Karte: „${cardData.word}”. Jetzt Antonym wählen.`, 'accent');
        return;
      }

      if (firstSelection.id === cardData.id) return;

      const antonymMap = getAntonymMap();

      if (antonymMap.get(firstSelection.word) === cardData.word) {
        clearTempStates();
        markMatched(firstSelection.word, cardData.word);
      } else {
        lockBoard = true;
        buttonEl.classList.add('wrong');
        firstSelection.element.classList.remove('selected');
        firstSelection.element.classList.add('wrong');
        setToast(`Kein Paar: „${firstSelection.word}” und „${cardData.word}”.`, 'danger');

        setTimeout(() => {
          clearTempStates();
          firstSelection = null;
          lockBoard = false;
          setToast('Versuch es nochmal.', 'neutral');
        }, 700);
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.setAttribute('aria-label', theme === 'light' ? 'Dunkles Thema' : 'Helles Thema');
      themeToggle.innerHTML = theme === 'light'
        ? '<span aria-hidden="true">◑</span>'
        : '<span aria-hidden="true">◐</span>';
    }

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(currentTheme);
    });

    shuffleBtn.addEventListener('click', () => {
      startBoard('Wähle eine Karte, dann klicke ihr Antonym.', 'neutral');
    });

    resetProgressBtn.addEventListener('click', clearProgress);

    langSwitch?.addEventListener('click', (e) => {
      const btn = e.target.closest('.lang-btn');
      if (!btn) return;
      setLanguage(btn.dataset.lang);
    });

    categorySwitch?.addEventListener('click', (e) => {
      const btn = e.target.closest('.segment-btn');
      if (!btn) return;
      setCategory(btn.dataset.category);
    });

    applyTheme(currentTheme);
    loadProgress();
    loadLanguage();
    loadCategory();
    renderLanguageSwitcher();
    renderCategorySwitcher();
    startBoard('Wähle eine Karte, dann klicke ihr Antonym.', 'neutral');
  </script>
</body>

</html>
